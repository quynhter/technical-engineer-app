<!doctype html>
<html lang="ru" data-astryx-theme="neutral" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ИТД · Рабочее пространство</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preload" href="/open-sans-regular.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/design.css"></head>
<body data-auth="pending">
<div id="account-controls" hidden><button id="session-resume" data-session-resume class="secondary" type="button" hidden>Войти</button><button id="account-open" class="secondary" type="button" aria-label="Настройки" aria-haspopup="dialog" hidden>Настройки</button><button id="session-logout" class="secondary" type="button" hidden>Выйти из системы</button></div>
<div class="context"><div><span class="context-label">Текущий объект</span><label class="sr" for="object-select">Выберите объект</label><select id="object-select"><option value="">Выберите объект или создайте новый</option></select></div><button id="new-object" class="secondary"> <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Новый объект</button></div>
<div id="breadcrumbs"></div>
<main><aside id="sidebar"></aside><section class="main-content"><div id="notice" role="status" aria-live="polite"></div><div id="content"></div><footer id="actions"></footer></section></main>
<footer id="workspace-status" aria-label="Состояние рабочего пространства"><div class="connection-tools"><span id="database-status" class="connection-status" data-state="checking" role="status" title="Проверка базы…"><i aria-hidden="true"></i><span class="sr">Проверка базы…</span></span></div></footer>
<dialog id="editor-dialog" class="workspace-dialog" aria-labelledby="editor-title"><div class="dialog-bar"><h2 id="editor-title" class="dialog-title">Ввод сведений</h2><div class="dialog-tools"><button type="button" class="secondary" data-session-resume hidden>Войти</button><button class="secondary" type="button" data-dialog-close aria-label="Закрыть окно">✕</button></div></div><div id="editor-notice" role="status"></div><div id="editor-content" class="dialog-content"></div><div id="editor-footer" class="dialog-footer" hidden></div></dialog><div id="toast" role="status"></div><div id="command-root"></div><script src="/design.js" defer></script><script src="/dialogs.js" defer></script><script src="/ui.js" defer></script><script src="/deletion.js" defer></script><script src="/tables.js" defer></script><script src="/manual.js" defer></script><script src="/act-fields.js" defer></script><script src="/journals.js" defer></script><script src="/resources.js" defer></script><script src="/ojr-ui.js" defer></script><script src="/configuration.js" defer></script><script src="/field-functions.js" defer></script><script src="/document-versions.js" defer></script><script src="/account.js" defer></script><script src="/app.js" defer></script>
<dialog id="knowledge-dialog" class="workspace-dialog workspace-dialog--wide" aria-labelledby="knowledge-title"><div class="dialog-bar"><h2 id="knowledge-title" class="dialog-title">Нормативная база знаний</h2><button id="knowledge-close" data-dialog-close class="secondary" type="button" aria-label="Закрыть базу знаний">✕</button></div><div class="dialog-content"><div class="knowledge-controls"><div class="knowledge-tools"><select id="knowledge-corpus" aria-label="Нормативный набор"><option value="">Все наборы</option></select><button id="knowledge-search" type="button">Найти</button></div><textarea id="knowledge-query" rows="3" maxlength="500" aria-label="Поиск по нормативам" placeholder="Введите слова или номер пункта, например: сопротивление изоляции"></textarea></div><p id="knowledge-message" role="status" aria-live="polite"></p><div id="knowledge-results"></div></div></dialog><script src="/knowledge-markdown.js" defer></script><script src="/knowledge.js" defer></script>
<dialog id="account-dialog" class="workspace-dialog workspace-dialog--settings" aria-labelledby="account-title">
 <div class="dialog-bar"><h2 id="account-title" class="dialog-title">Настройки</h2><button class="secondary" type="button" data-dialog-close aria-label="Закрыть настройки">✕</button></div>
 <div class="dialog-content" id="account-content"></div>
</dialog>
<dialog id="prompt-dialog" class="workspace-dialog workspace-dialog--compact" aria-labelledby="prompt-title">
 <div class="dialog-bar"><h2 id="prompt-title" class="dialog-title"></h2><button class="secondary" type="button" data-dialog-close aria-label="Закрыть окно">✕</button></div>
 <div class="dialog-content" id="prompt-content"></div>
</dialog>
<dialog id="login-dialog" class="workspace-dialog workspace-dialog--compact" aria-labelledby="login-title">
 <div class="dialog-bar"><h2 id="login-title" class="dialog-title">Вход в ИТД</h2><button id="login-cancel" type="button" class="secondary" data-dialog-close hidden aria-label="Вернуться к введённым данным">✕</button></div>
 <div class="dialog-content">
  <form id="login-form">
   <p class="hint">Откройте выданную ссылку или вставьте код входа.</p>
   <label class="field"><span>Код входа</span><input name="code" type="password" autocomplete="current-password" required autofocus></label>
   <p class="account-message" role="status"></p>
   <button type="submit">Войти</button>
  </form>
 </div>
</dialog>
</body></html>
